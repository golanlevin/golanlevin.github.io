<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arrange locally imported animated GLB characters on a shared 3D stage.">
    <title>GLB Character Stage</title>
    <style>:root{color:#303431;background:#f4f4f1;font:13px/1.45 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer;white-space:nowrap;background:#fff;border:1px solid #d0d3cd;border-radius:4px;padding:6px 10px}button:hover:not(:disabled){background:#f0f2ed;border-color:#aab1a7}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,canvas:focus-visible{outline-offset:2px;outline:2px solid #2664ce}[hidden]{display:none!important}#app{grid-template-columns:minmax(0,1fr) 270px;width:100vw;height:100dvh;display:grid}#app.sidebar-collapsed{grid-template-columns:minmax(0,1fr) 0}#viewport{min-width:0;min-height:0;position:relative;overflow:hidden}canvas{touch-action:none;width:100%;height:100%;display:block}canvas.moving{cursor:grabbing!important}canvas.rotating{cursor:crosshair!important}#toolbar{z-index:2;pointer-events:none;flex-wrap:wrap;align-items:start;gap:6px;display:flex;position:absolute;top:14px;left:14px;right:14px}#toolbar button{pointer-events:auto}#toggle-sidebar{margin-left:auto}#empty-stage{text-align:center;pointer-events:none;color:#6a7169;font-size:15px;position:absolute;top:43%;left:0;right:0}#empty-stage span{margin-top:5px;font-size:12px;display:block}#drop-overlay{pointer-events:none;z-index:3;background:#2664ce0b;border:2px dashed #2664ce;border-radius:5px;display:none;position:absolute;inset:8px}.drop-active #drop-overlay{display:block}#stage-help{color:#697067;pointer-events:none;font-size:11px;position:absolute;bottom:12px;left:15px;right:15px}#sidebar{background:#fafbf8;border-left:1px solid #d7dad3;flex-direction:column;min-width:0;display:flex;overflow:hidden}#sidebar-header{border-bottom:1px solid #e0e3dc;align-items:center;gap:8px;padding:15px 13px 11px;display:flex}h1{letter-spacing:.06em;text-transform:uppercase;margin:0;font-size:12px;font-weight:650}#character-count{color:#7b8178;font-size:11px}#sidebar-header button{margin-left:auto;padding:4px 7px;font-size:12px}#sidebar-scroll{overscroll-behavior:contain;flex:1;min-height:0;overflow:hidden auto}#empty-list{color:#7b8178;margin:18px 14px;font-size:12px}.character-entry{border-bottom:1px solid #e0e3dc;border-left:3px solid #0000}.character-entry.selected{background:#edf2fb;border-left-color:#2664ce}.character-heading{align-items:center;gap:2px;min-width:0;padding:8px 7px 8px 3px;display:flex}.disclosure{color:#757e70;background:0 0;border-color:#0000;flex:0 0 24px;padding:4px 0}.character-name{text-align:left;text-overflow:ellipsis;background:0 0;border-color:#0000;flex:1;min-width:0;padding:4px 3px;font-size:12px;overflow:hidden}.character-name[aria-pressed=true]{color:#2054ac;font-weight:650}.character-fields{padding:0 13px 11px 26px}.character-fields label{grid-template-columns:minmax(0,1fr) 96px;align-items:center;gap:8px;margin:5px 0;font-size:12px;display:grid}input[type=number]{width:100%;min-width:0;color:inherit;font-variant-numeric:tabular-nums;background:#fff;border:1px solid #cbd1c7;border-radius:3px;padding:5px 6px}.entry-footer{justify-content:space-between;align-items:center;gap:8px;margin-top:10px;display:flex}.animation-label{color:#7b8178;font-size:10px}.remove{color:#8d4137;padding:3px 7px;font-size:11px}#sidebar-footer{border-top:1px solid #e0e3dc;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;display:flex}#status{color:#7b8178;text-overflow:ellipsis;white-space:nowrap;font-size:11px;overflow:hidden}#clear{padding:4px 7px;font-size:11px}#errors{z-index:4;pointer-events:none;position:absolute;top:59px;left:14px;right:14px}.error-message{color:#893a2d;pointer-events:auto;background:#fff6f3;border:1px solid #d6a599;border-radius:4px;align-items:start;gap:14px;max-width:560px;margin-bottom:6px;padding:9px 11px;font-size:12px;display:flex}.error-message button{color:inherit;background:0 0;border:0;margin-left:auto;padding:0 4px;font-size:19px;line-height:1.1}@media (width<=700px){#app{grid-template-columns:minmax(0,1fr) 230px}#toolbar{gap:4px;top:9px;left:9px;right:9px}#toolbar button{padding:5px 7px;font-size:11px}#toggle-sidebar{margin-left:0}#stage-help{font-size:10px}.character-fields{padding-left:16px}.character-fields label{grid-template-columns:minmax(0,1fr) 83px}}</style>
    <script type="module" crossorigin src="./world.js"></script>
  </head>
  <body>
    <main id="app">
      <section id="viewport" aria-label="3D stage">
        <nav id="toolbar" aria-label="Stage controls">
          <button type="button" data-add-glb>Add GLB</button>
          <button type="button" id="pause" aria-pressed="false" disabled>Pause</button>
          <button type="button" id="reset-view">Reset View</button>
          <button type="button" id="toggle-sidebar" aria-controls="sidebar" aria-expanded="true">Hide characters</button>
        </nav>
        <div id="empty-stage">Drop GLB files here<span>or choose Add GLB</span></div>
        <div id="drop-overlay"></div>
        <div id="errors" aria-live="polite"></div>
        <div id="stage-help">Drag character: move · Blue handle: rotate · Empty space: orbit · Right-drag: pan · Wheel: zoom · Double-click: frame</div>
      </section>
      <aside id="sidebar" aria-label="Characters">
        <div id="sidebar-header">
          <h1>Characters</h1><span id="character-count">0</span>
          <button type="button" data-add-glb aria-label="Add GLB files">+ Add GLB</button>
        </div>
        <div id="sidebar-scroll">
          <p id="empty-list">No characters yet.</p>
          <div id="character-list"></div>
        </div>
        <div id="sidebar-footer">
          <span id="status" role="status">Starting…</span>
          <button type="button" id="clear" disabled>Clear Scene</button>
        </div>
      </aside>
    </main>
    <input id="file-picker" type="file" accept=".glb" multiple hidden>
  </body>
</html>
